<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 02 — demo (преподаватель)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #1a1a2e;
      color: #eee;
      font-family: system-ui, sans-serif;
    }
    canvas {
      border: 2px solid #4ecca3;
      background: #16213e;
      display: block;
    }
    p { margin: 0; font-size: 0.9rem; opacity: 0.85; }
  </style>
</head>
<body>
  <canvas id="game" width="640" height="480"></canvas>
  <p>WASD / стрелки — движение · не проходить сквозь красные блоки</p>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const player = {
      x: 80,
      y: 80,
      w: 28,
      h: 28,
      speed: 4,
      color: '#4ecca3',
    };

    const obstacles = [
      { x: 280, y: 200, w: 120, h: 32, color: '#e94560' },
      { x: 120, y: 320, w: 200, h: 24, color: '#e94560' },
    ];

    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    function rectsOverlap(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function hitsAnyObstacle(rect) {
      return obstacles.some((obs) => rectsOverlap(rect, obs));
    }

    function tryMove(dx, dy) {
      const prevX = player.x;
      const prevY = player.y;

      player.x += dx;
      if (hitsAnyObstacle(player)) player.x = prevX;

      player.y += dy;
      if (hitsAnyObstacle(player)) player.y = prevY;
    }

    function update() {
      let dx = 0;
      let dy = 0;

      if (keys['KeyW'] || keys['ArrowUp']) dy -= player.speed;
      if (keys['KeyS'] || keys['ArrowDown']) dy += player.speed;
      if (keys['KeyA'] || keys['ArrowLeft']) dx -= player.speed;
      if (keys['KeyD'] || keys['ArrowRight']) dx += player.speed;

      if (dx !== 0) tryMove(dx, 0);
      if (dy !== 0) tryMove(0, dy);

      player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
      player.y = Math.max(0, Math.min(canvas.height - player.h, player.y));
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const obs of obstacles) {
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      }

      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.w, player.h);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
