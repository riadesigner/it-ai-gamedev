<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Таблица лута</title>
<style>
  :root {
    --bg:          #0e1116;
    --surface:     #151a21;
    --surface-2:   #12171e;
    --surface-3:   #1b222b;
    --border:      #232a33;
    --border-soft: #1d232b;
    --text:        #e6edf3;
    --text-dim:    #b6c2d1;
    --muted:       #8b97a6;
    --muted-2:     #6f7b8a;
    --accent:      #d4a24a;
    --radius:      14px;
  }

  * { box-sizing: border-box; }

  html { color-scheme: dark; }

  body {
    margin: 0;
    padding: 28px 18px 60px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  /* ---------- Шапка ---------- */
  .page-head {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 18px;
  }

  .page-head h1 {
    margin: 0 0 4px;
    font-size: 24px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }

  .sub {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .search {
    flex: 0 1 320px;
    min-width: 220px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search::placeholder { color: var(--muted-2); }
  .search:focus {
    border-color: #3a4553;
    box-shadow: 0 0 0 3px rgba(212, 162, 74, .12);
  }

  /* ---------- Карточка таблицы ---------- */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    padding: 13px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-soft);
    vertical-align: top;
  }

  tbody tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: #181e26; }

  /* ---------- Ячейка «Предмет» ---------- */
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .icon {
    flex: 0 0 38px;
    width: 38px;
    height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: var(--surface-3);
    border: 1px solid #262e38;
    color: var(--accent);          /* одноцветные иконки */
  }
  .icon svg { width: 20px; height: 20px; display: block; }

  .item-text { display: flex; flex-direction: column; min-width: 0; }

  .item-name {
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }

  .item-id {
    font-size: 11.5px;
    color: var(--muted-2);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Тип ---------- */
  .tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid #2b333e;
    background: var(--surface-3);
    color: var(--text-dim);
    font-size: 12.5px;
    white-space: nowrap;
  }

  /* ---------- Редкость ---------- */
  .rarity {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    white-space: nowrap;
    color: var(--muted);
  }
  .rarity i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    flex: 0 0 auto;
  }

  .rarity[data-rarity="обычный"]     { color: #6b7684; }
  .rarity[data-rarity="необычный"]   { color: #8b97a6; }
  .rarity[data-rarity="редкий"]      { color: var(--text-dim); }
  .rarity[data-rarity="эпический"]   { color: var(--accent); }
  .rarity[data-rarity="легендарный"] {
    color: #f0c674;
    text-shadow: 0 0 12px rgba(240, 198, 116, .35);
  }

  /* ---------- Описание ---------- */
  .cell-desc {
    color: var(--muted);
    font-size: 13.5px;
    max-width: 360px;
    min-width: 180px;
  }

  /* ---------- Характеристики ---------- */
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 320px;
  }

  .stat {
    display: inline-flex;
    gap: 6px;
    align-items: baseline;
    padding: 3px 8px;
    border-radius: 7px;
    background: var(--surface-3);
    border: 1px solid #262e38;
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
  }
  .stat b { font-weight: 600; color: #cfd9e4; }

  /* ---------- Цена ---------- */
  .cell-value { white-space: nowrap; text-align: right; }

  .value {
    font-weight: 650;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .coin { font-size: 11.5px; color: var(--muted-2); }

  /* ---------- Пустой результат ---------- */
  .empty-row td {
    padding: 44px 16px;
    text-align: center;
    color: var(--muted-2);
    font-size: 14px;
  }

  /* =========================================================
     АДАПТИВ: до 860px таблица превращается в карточки
     ========================================================= */
  @media (max-width: 860px) {
    body { padding: 20px 12px 48px; }

    .table-card { border-radius: 12px; }

    thead { display: none; }

    table, tbody, tr, td { display: block; width: 100%; }

    tbody tr {
      padding: 16px;
      border-bottom: 1px solid var(--border-soft);
    }
    tbody tr:last-child { border-bottom: 0; }
    tbody tr:hover { background: transparent; }

    tbody td {
      padding: 0;
      border: 0;
      margin-top: 11px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
    }

    tbody td::before {
      content: attr(data-label);
      flex: 0 0 92px;
      padding-top: 3px;
      font-size: 10.5px;
      font-weight: 650;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted-2);
    }

    /* Первая ячейка — заголовок карточки, без подписи */
    td.cell-name {
      display: block;
      margin-top: 0;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-soft);
    }
    td.cell-name::before { display: none; }

    .cell-desc { max-width: none; min-width: 0; }
    .stats { max-width: none; }

    .cell-value { text-align: left; }

    .empty-row td { display: block; }
    .empty-row td::before { display: none; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="page-head">
    <div>
      <h1>Таблица лута</h1>
      <p class="sub" id="count">—</p>
    </div>
    <input
      id="search"
      class="search"
      type="search"
      placeholder="Поиск: название, тип, редкость…"
      autocomplete="off"
    />
  </header>

  <div class="table-card">
    <table id="loot-table">
      <thead>
        <tr>
          <th scope="col">Предмет</th>
          <th scope="col">Тип</th>
          <th scope="col">Редкость</th>
          <th scope="col">Описание</th>
          <th scope="col">Характеристики</th>
          <th scope="col" style="text-align:right">Цена</th>
        </tr>
      </thead>
      <tbody id="loot-body"></tbody>
    </table>
  </div>

</div>

<script>
/* =========================================================
   1. Иконки (одноцветные, stroke = currentColor)
   ========================================================= */
const svg = (paths) =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;

const ICONS = {
  'оружие': svg(`
    <path d="M14.5 17.5 3 6V3h3l11.5 11.5"/>
    <path d="m13 19 6-6"/>
    <path d="m16 16 4 4"/>
    <path d="m19 21 2-2"/>`),

  'броня': svg(`
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    <path d="m9 11.5 2 2 4-4"/>`),

  'щит': svg(`
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>`),

  'расходник': svg(`
    <path d="M9 2h6"/>
    <path d="M10 2v7.2L5.4 17A2 2 0 0 0 7.2 20h9.6a2 2 0 0 0 1.8-3L14 9.2V2"/>
    <path d="M7.2 14h9.6"/>`),

  'свиток': svg(`
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <path d="M14 2v6h6"/>
    <path d="M9 13h6"/>
    <path d="M9 17h4"/>`),

  'аксессуар': svg(`
    <circle cx="12" cy="14.5" r="5.5"/>
    <path d="m9.4 9.9 2.6-6 2.6 6"/>`),

  'плащ': svg(`
    <path d="M12 3a4 4 0 0 0-4 4v3.5L5 21h14l-3-10.5V7a4 4 0 0 0-4-4z"/>
    <path d="M10 21v-5.5a2 2 0 0 1 4 0V21"/>`),

  'боеприпас': svg(`
    <path d="M5 19 19 5"/>
    <path d="M11 5h8v8"/>`),

  'материал': svg(`
    <path d="M6 3h12l3 6-9 12L3 9z"/>
    <path d="M3 9h18"/>
    <path d="m9 3-2 6 5 12 5-12-2-6"/>`),

  'ключ': svg(`
    <circle cx="8" cy="15" r="4"/>
    <path d="m10.9 12.1 8.1-8.1"/>
    <path d="m17 6 2 2"/>
    <path d="m14 9 2 2"/>`),

  'инструмент': svg(`
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>`),

  '__default': svg(`
    <path d="m21 16-9 5-9-5V8l9-5 9 5z"/>
    <path d="m3 8 9 5 9-5"/>
    <path d="M12 21v-8"/>`)
};

/* =========================================================
   2. Парсим JSON «как есть»
   ========================================================= */
const loot = JSON.parse(document.getElementById('loot-data').textContent);

/* =========================================================
   3. Хелперы
   ========================================================= */
const escapeHtml = (value) =>
  String(value).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));

const humanize = (key) => key.replace(/_/g, ' ');

const iconFor = (type) => ICONS[type] || ICONS.__default;

/* =========================================================
   4. Отрисовка
   ========================================================= */
const tbody  = document.getElementById('loot-body');
const countEl = document.getElementById('count');

function renderRow(item) {
  const stats = Object.entries(item.stats || {})
    .map(([key, val]) =>
      `<span class="stat"><b>${escapeHtml(humanize(key))}</b>${escapeHtml(val)}</span>`
    )
    .join('');

  return `
    <tr>
      <td class="cell-name" data-label="Предмет">
        <div class="item">
          <span class="icon">${iconFor(item.type)}</span>
          <span class="item-text">
            <span class="item-name">${escapeHtml(item.name)}</span>
            <span class="item-id">#${escapeHtml(item.id)}</span>
          </span>
        </div>
      </td>
      <td data-label="Тип"><span class="tag">${escapeHtml(item.type)}</span></td>
      <td data-label="Редкость">
        <span class="rarity" data-rarity="${escapeHtml(item.rarity)}">
          <i></i>${escapeHtml(item.rarity)}
        </span>
      </td>
      <td class="cell-desc" data-label="Описание">${escapeHtml(item.description)}</td>
      <td data-label="Характеристики"><div class="stats">${stats}</div></td>
      <td class="cell-value" data-label="Цена">
        <span class="value">${Number(item.value).toLocaleString('ru-RU')}</span>
        <span class="coin">зол.</span>
      </td>
    </tr>`;
}

function renderList(items) {
  if (!items.length) {
    tbody.innerHTML =
      '<tr class="empty-row"><td colspan="6">Ничего не найдено</td></tr>';
  } else {
    tbody.innerHTML = items.map(renderRow).join('');
  }

  countEl.textContent =
    `Показано ${items.length} из ${loot.length} предметов`;
}

/* =========================================================
   5. Поиск
   ========================================================= */
const searchInput = document.getElementById('search');

searchInput.addEventListener('input', () => {
  const query = searchInput.value.trim().toLowerCase();

  const filtered = !query
    ? loot
    : loot.filter((item) =>
        [item.name, item.type, item.rarity, item.description]
          .some((field) => String(field).toLowerCase().includes(query))
      );

  renderList(filtered);
});
