<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 02 — demo + враг (преподаватель)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #1a1a2e;
      color: #eee;
      font-family: system-ui, sans-serif;
    }
    canvas {
      border: 2px solid #4ecca3;
      background: #16213e;
      display: block;
    }
    p { margin: 0; font-size: 0.9rem; opacity: 0.85; max-width: 640px; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game" width="640" height="480"></canvas>
  <p>WASD — игрок · оранжевый враг: patrol → chase → attack · не раздавать до конца практики</p>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const player = {
      x: 80,
      y: 80,
      w: 28,
      h: 28,
      speed: 4,
      color: '#4ecca3',
    };

    const obstacles = [
      { x: 280, y: 200, w: 120, h: 32, color: '#e94560' },
      { x: 120, y: 320, w: 200, h: 24, color: '#e94560' },
    ];

    const patrolPoints = [
      { x: 480, y: 120 },
      { x: 560, y: 120 },
      { x: 560, y: 200 },
      { x: 480, y: 200 },
    ];

    const enemy = {
      x: 480,
      y: 120,
      w: 28,
      h: 28,
      speedPatrol: 2,
      speedChase: 3.2,
      color: '#f5a623',
      state: 'patrol',
      patrolIndex: 0,
      attackTimer: 0,
      visionRadius: 140,
      attackRadius: 36,
    };

    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    function rectsOverlap(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function center(rect) {
      return { x: rect.x + rect.w / 2, y: rect.y + rect.h / 2 };
    }

    function distance(a, b) {
      const ac = center(a);
      const bc = center(b);
      const dx = ac.x - bc.x;
      const dy = ac.y - bc.y;
      return Math.hypot(dx, dy);
    }

    function hitsAnyObstacle(rect) {
      return obstacles.some((obs) => rectsOverlap(rect, obs));
    }

    function tryMoveEntity(entity, dx, dy) {
      const prevX = entity.x;
      const prevY = entity.y;

      entity.x += dx;
      if (hitsAnyObstacle(entity)) entity.x = prevX;

      entity.y += dy;
      if (hitsAnyObstacle(entity)) entity.y = prevY;

      entity.x = Math.max(0, Math.min(canvas.width - entity.w, entity.x));
      entity.y = Math.max(0, Math.min(canvas.height - entity.h, entity.y));
    }

    function moveToward(entity, targetX, targetY, speed) {
      const c = center(entity);
      const dx = targetX - c.x;
      const dy = targetY - c.y;
      const len = Math.hypot(dx, dy) || 1;
      tryMoveEntity(entity, (dx / len) * speed, (dy / len) * speed);
    }

    function updatePlayer() {
      let dx = 0;
      let dy = 0;

      if (keys['KeyW'] || keys['ArrowUp']) dy -= player.speed;
      if (keys['KeyS'] || keys['ArrowDown']) dy += player.speed;
      if (keys['KeyA'] || keys['ArrowLeft']) dx -= player.speed;
      if (keys['KeyD'] || keys['ArrowRight']) dx += player.speed;

      if (dx !== 0) tryMoveEntity(player, dx, 0);
      if (dy !== 0) tryMoveEntity(player, 0, dy);
    }

    function updateEnemy() {
      const dist = distance(enemy, player);

      if (enemy.state === 'attack') {
        enemy.attackTimer -= 1;
        if (enemy.attackTimer <= 0) {
          enemy.state = dist <= enemy.visionRadius ? 'chase' : 'patrol';
        }
        return;
      }

      if (dist <= enemy.attackRadius) {
        enemy.state = 'attack';
        enemy.attackTimer = 30;
        return;
      }

      if (dist <= enemy.visionRadius) {
        enemy.state = 'chase';
        const pc = center(player);
        moveToward(enemy, pc.x, pc.y, enemy.speedChase);
        return;
      }

      enemy.state = 'patrol';
      const target = patrolPoints[enemy.patrolIndex];
      const ec = center(enemy);
      if (Math.hypot(target.x - ec.x, target.y - ec.y) < 6) {
        enemy.patrolIndex = (enemy.patrolIndex + 1) % patrolPoints.length;
      }
      const next = patrolPoints[enemy.patrolIndex];
      moveToward(enemy, next.x, next.y, enemy.speedPatrol);
    }

    function update() {
      updatePlayer();
      updateEnemy();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const obs of obstacles) {
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      }

      ctx.fillStyle = enemy.state === 'attack' ? '#ff6b6b' : enemy.color;
      ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);

      ctx.fillStyle = '#888';
      ctx.font = '12px system-ui, sans-serif';
      ctx.fillText(`враг: ${enemy.state}`, enemy.x, enemy.y - 6);

      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.w, player.h);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
