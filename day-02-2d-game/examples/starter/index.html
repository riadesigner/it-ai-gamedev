<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 02 — canvas starter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #1a1a2e;
      color: #eee;
      font-family: system-ui, sans-serif;
    }
    canvas {
      border: 2px solid #4ecca3;
      background: #16213e;
      display: block;
    }
    p { margin: 0; font-size: 0.9rem; opacity: 0.85; }
  </style>
</head>
<body>
  <canvas id="game" width="640" height="480"></canvas>
  <p>WASD / стрелки — движение (часть 1) · оранжевый враг оживёт в части 2</p>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const player = {
      x: 80,
      y: 80,
      w: 28,
      h: 28,
      speed: 4,
      color: '#4ecca3',
    };

    const obstacles = [
      { x: 280, y: 200, w: 120, h: 32, color: '#e94560' },
      { x: 120, y: 320, w: 200, h: 4, color: '#e94560' },
    ];

    // Враг из GDD — пока статичный; поведение (patrol / chase / attack) — часть 2 практики
    const enemy = {
      x: 480,
      y: 120,
      w: 28,
      h: 28,
      color: '#f5a623',
    };

    const keys = {};

    // TODO: keydown / keyup → keys[e.code]

    function rectsOverlap(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function update() {
      // TODO: движение игрока + коллизия с obstacles
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const obs of obstacles) {
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      }

      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.w, player.h);

      ctx.fillStyle = enemy.color;
      ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
